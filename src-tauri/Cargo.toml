[package]
name = "ai-verse"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_verse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0" # Clean error handling
dirs = "5.0"

# --- RAG Stack ---
# 1. Vector Database
lancedb = "=0.23.1"
arrow-schema = "=56.2.0"
arrow-array = "=56.2.0"

futures = "0.3"

# 2. Embeddings (Local, Fast, Rust-native)
fastembed = "5.6.0"

# Utilities
ulid = "1.1"

# 3. Chunking & Text Processing
# extractous = "0.3" # High-performance extraction (PDF, Word, etc.)
# text-splitter = { version = "0.11", features = ["tiktoken-rs", "markdown"] }
text-splitter = { version = "0.29.3", features = ["tiktoken-rs", "markdown"] }

# 4. HTTP Client (for Ollama/Cloud LLMs)
reqwest = { version = "0.11", features = ["json"] }
